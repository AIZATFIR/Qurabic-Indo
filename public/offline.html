<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ef">
  <title>Qurabic · Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #faf6ef; color: #26211c; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)); display: grid; place-items: center; }
    main { width: min(100%, 34rem); }
    .mark { color: #6e4c34; font-family: Georgia, serif; font-size: 1.125rem; font-weight: 600; }
    h1 { margin: 48px 0 12px; font-family: Georgia, serif; font-size: clamp(1.75rem, 8vw, 2.5rem); font-weight: 500; line-height: 1.2; }
    p { max-width: 32rem; margin: 0; color: #52473d; font-size: 1rem; line-height: 1.7; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    button { min-height: 44px; padding: 0 16px; border: 1px solid #e5dacb; border-radius: 12px; background: #fffdf9; color: #533521; font: inherit; font-size: .9375rem; cursor: pointer; }
    button:focus-visible { outline: 2px solid #6e4c34; outline-offset: 3px; }
    #retry { border-color: #6e4c34; background: #6e4c34; color: #fffdf9; }
    #status { min-height: 24px; margin-top: 20px; font-size: .875rem; }
    @media (prefers-reduced-motion: no-preference) { #retry { transition: background-color 140ms ease-out; } #retry:hover { background: #533521; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="Qurabic">Qurabic</div>
    <h1 id="title">Tidak dapat terhubung ke Qurabic</h1>
    <p id="message">Periksa koneksi internet lalu coba lagi. Setelah pembaca dan paket teks tersimpan, ayat Al-Qur’an beserta terjemahannya dapat dibaca tanpa koneksi.</p>
    <div class="actions">
      <button id="retry" type="button">Coba lagi</button>
      <button id="language" type="button" aria-label="Ganti bahasa">English</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const copy = {
        id: {
          title: 'Tidak dapat terhubung ke Qurabic',
          message: 'Periksa koneksi internet lalu coba lagi. Setelah pembaca dan paket teks tersimpan, ayat Al-Qur’an beserta terjemahannya dapat dibaca tanpa koneksi.',
          retry: 'Coba lagi',
          language: 'English',
          languageLabel: 'Ganti bahasa',
          status: 'Perangkat sedang offline.',
        },
        en: {
          title: 'Can’t connect to Qurabic',
          message: 'Check your internet connection and try again. Once the reader and text pack are saved, Quran verses and translations can be read offline.',
          retry: 'Try again',
          language: 'Bahasa Indonesia',
          languageLabel: 'Switch language',
          status: 'This device is offline.',
        },
      };
      let language;
      try { language = localStorage.getItem('qurabic_language'); } catch {}
      if (language !== 'id' && language !== 'en') language = navigator.language.toLowerCase().startsWith('en') ? 'en' : 'id';
      const render = () => {
        const text = copy[language];
        document.documentElement.lang = language;
        document.getElementById('title').textContent = text.title;
        document.getElementById('message').textContent = text.message;
        document.getElementById('retry').textContent = text.retry;
        document.getElementById('language').textContent = text.language;
        document.getElementById('language').setAttribute('aria-label', text.languageLabel);
        document.getElementById('status').textContent = navigator.onLine ? '' : text.status;
      };
      document.getElementById('retry').addEventListener('click', () => location.replace('https://qurabic-indo-corpus.vercel.app/baca'));
      document.getElementById('language').addEventListener('click', () => {
        language = language === 'id' ? 'en' : 'id';
        try { localStorage.setItem('qurabic_language', language); } catch {}
        render();
      });
      window.addEventListener('online', () => location.replace('https://qurabic-indo-corpus.vercel.app/baca'));
      window.addEventListener('offline', render);
      render();
    })();
  </script>
</body>
</html>
