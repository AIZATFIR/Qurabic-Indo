apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv('QURABIC_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('QURABIC_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('QURABIC_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('QURABIC_ANDROID_KEY_PASSWORD')
def releaseAdMobAppId = System.getenv('NEXT_PUBLIC_ADMOB_APP_ID') ?: System.getenv('QURABIC_ADMOB_APP_ID')
def releaseBannerId = System.getenv('NEXT_PUBLIC_ADMOB_BANNER_ID')
def releaseInterstitialId = System.getenv('NEXT_PUBLIC_ADMOB_INTERSTITIAL_ID')
def googleSampleAdPublisherId = 'ca-app-pub-3940256099942544'
def releaseVersionCode = System.getenv('QURABIC_ANDROID_VERSION_CODE')
def configuredVersionCode = (releaseVersionCode ?: '1').toInteger()
def configuredVersionName = System.getenv('QURABIC_ANDROID_VERSION_NAME') ?: '1.0.0'
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }

if (configuredVersionCode < 1) {
    throw new GradleException('QURABIC_ANDROID_VERSION_CODE must be a positive integer.')
}

android {
    namespace = "com.qurabic.indo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.qurabic.indo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode
        versionName configuredVersionName
        manifestPlaceholders = [ADMOB_APP_ID: 'ca-app-pub-3940256099942544~3347511713']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        release {
            manifest.srcFile releaseAdMobAppId?.trim()
                    ? 'src/releaseWithAds/AndroidManifest.xml'
                    : 'src/releaseNoAds/AndroidManifest.xml'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('Release signing is not configured; this artifact will be unsigned. Set QURABIC_ANDROID_KEYSTORE_PATH, QURABIC_ANDROID_KEYSTORE_PASSWORD, QURABIC_ANDROID_KEY_ALIAS, and QURABIC_ANDROID_KEY_PASSWORD for Play Store builds.')
            }
            if (releaseAdMobAppId?.trim()) {
                manifestPlaceholders = [ADMOB_APP_ID: releaseAdMobAppId.trim()]
            } else {
                logger.warn('Production AdMob is not configured; the release manifest will omit the debug test app ID and production ads will remain disabled.')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (!releaseAdMobAppId?.trim()) {
    def admobDependency = configurations.implementation.dependencies.find { dependency ->
        dependency instanceof org.gradle.api.artifacts.ProjectDependency &&
                dependency.dependencyProject.path == ':capacitor-community-admob'
    }
    if (admobDependency != null) {
        configurations.implementation.dependencies.remove(admobDependency)
        dependencies {
            debugImplementation project(':capacitor-community-admob')
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (!taskGraph.allTasks.any { task -> task.path == ':app:bundleRelease' }) return

    if (!hasReleaseSigning) {
        throw new GradleException('A Play Store AAB requires QURABIC_ANDROID_KEYSTORE_PATH, QURABIC_ANDROID_KEYSTORE_PASSWORD, QURABIC_ANDROID_KEY_ALIAS, and QURABIC_ANDROID_KEY_PASSWORD.')
    }
    if (!releaseVersionCode?.trim()) {
        throw new GradleException('Set QURABIC_ANDROID_VERSION_CODE to a new positive integer before building a Play Store AAB.')
    }
    def configuredAdIds = [releaseAdMobAppId, releaseBannerId, releaseInterstitialId]
            .findAll { value -> value != null && !value.trim().isEmpty() }
    if (configuredAdIds.any { value -> value.contains(googleSampleAdPublisherId) }) {
        throw new GradleException('Google sample AdMob IDs are for testing only. Remove them from the release environment before building a Play Store AAB.')
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
